name: Build & Release
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install WiX (for MSI bundler)
        run: dotnet tool install --global wix --version 5.0.2 2>$null; if ($?) { echo "WiX installed" } else { echo "WiX not available, will use NSIS fallback" }

      - name: Build Tauri app
        run: npx tauri build -- --bundles nsis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ""
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: crosshair-app-windows
          path: |
            src-tauri/target/release/*.exe
            src-tauri/target/release/**/*.msi
          if-no-files-found: warn
